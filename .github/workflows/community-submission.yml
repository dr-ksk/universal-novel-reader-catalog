name: Community Adapter Submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process-submission:
    if: contains(github.event.issue.labels.*.name, 'community-adapter') || startsWith(github.event.issue.title, '[定義投稿]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import and validate submission
        id: validate
        run: |
          node scripts/import_issue.mjs
          node -e '
            const fs = require("fs");
            const res = JSON.parse(fs.readFileSync(".submission_result.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ok=${res.ok}\n`);
            if (res.ok) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `adapter_id=${res.adapter_id}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${res.name}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${res.version}\n`);
            } else {
              const msg = (res.errors || []).map(e => `- ${e}`).join("\n");
              fs.writeFileSync(".submission_errors.txt", msg, "utf8");
            }
          '

      - name: Rebuild catalog and commit if valid
        if: steps.validate.outputs.ok == 'true'
        run: |
          node scripts/build_catalog.mjs
          rm -f .submission_result.json .submission_errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/
          if ! git diff --cached --quiet; then
            git commit -m "community: publish ${{ steps.validate.outputs.adapter_id }} v${{ steps.validate.outputs.version }} (#${{ github.event.issue.number }})"
            git push
          fi

      - name: Comment result on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.validate.outputs.ok }}' === 'true';
            if (ok) {
              const id = '${{ steps.validate.outputs.adapter_id }}';
              const name = '${{ steps.validate.outputs.name }}';
              const ver = '${{ steps.validate.outputs.version }}';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **野良カタログへ公開しました！**\n\n- サイト名: **${name}** (\`${id}\` v${ver})\n- 1〜2分後に「万能小説」アプリ内の **サイト定義マーケット → 野良タブ** に反映されます。\n- 修正したい場合は、この Issue 本文を編集すると自動更新されます。`
              });
            } else {
              const errs = fs.existsSync('.submission_errors.txt')
                ? fs.readFileSync('.submission_errors.txt', 'utf8')
                : '- 形式エラー';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **自動公開できませんでした**\n\n以下の点を確認し、この Issue 本文を修正してください：\n${errs}`
              });
            }
